<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- Background — solid rounded square. GitHub crops circular,
       so the corners can be square; the rounding just looks nice
       in places that show the full bitmap (org cards, READMEs). -->
  <rect width="24" height="24" rx="3" ry="3" fill="#0d1117"/>

  <!-- Pixel-art agent (same silhouette as static/agent-icon.svg,
       scaled up + centered in a 24x24 square). Warm orange so the
       avatar reads at small sizes without depending on the page's
       currentColor. -->
  <g fill="#f57c00">
    <!-- Head -->
    <rect x="6" y="4" width="12" height="6"/>
    <!-- Belt / arms (extending out past the body) -->
    <rect x="3" y="9" width="18" height="2"/>
    <!-- Lower body -->
    <rect x="6" y="11" width="12" height="2"/>
    <!-- Two legs -->
    <rect x="8"  y="13" width="2" height="4"/>
    <rect x="14" y="13" width="2" height="4"/>
    <!-- Antenna stub for character -->
    <rect x="11" y="2" width="2" height="2"/>
  </g>

  <!-- Eyes — bright cyan dots that stay readable at favicon size.
       The original icon uses near-black eyes against a colored
       robot; on a dark page background that goes invisible, so we
       invert the contrast here. -->
  <g fill="#e6fbff">
    <rect x="9"  y="6" width="1" height="2"/>
    <rect x="14" y="6" width="1" height="2"/>
  </g>
</svg>
