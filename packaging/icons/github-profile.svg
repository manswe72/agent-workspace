<?xml version="1.0" encoding="UTF-8"?>
<!-- Agent Workspace GitHub profile icon. Square version of the
     dashboard favicon: dark rounded slate background with the
     bright-blue git-branch glyph centered on it. Matches the
     PWA / dock entry the user sees. GitHub crops avatars to a
     circle in most places; the rounded-square corners just look
     nice in the few spots that show the full bitmap. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Slate background -->
  <rect width="64" height="64" rx="10" ry="10" fill="#1f2328"/>

  <!-- Git-branch glyph — same shape + colour as static/favicon.svg
       but scaled to 2× and centered with a bit of breathing room. -->
  <g fill="#0969da" stroke="#0969da" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="20" y1="18" x2="20" y2="46"/>
    <path d="M 20 32 L 46 32" fill="none"/>
    <circle cx="20" cy="12" r="7"/>
    <circle cx="20" cy="52" r="7"/>
    <circle cx="50" cy="32" r="7"/>
  </g>
</svg>
