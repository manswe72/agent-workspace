<?xml version="1.0" encoding="UTF-8"?>
<!-- Agent Workspace favicon — same pixel-art robot design used for
     the GitHub profile + app icon. 32×32 viewBox so browsers render
     cleanly down to 16×16. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" rx="4" ry="4" fill="#0d1117"/>
  <g fill="#f57c00">
    <!-- Head -->
    <rect x="8" y="6" width="16" height="8"/>
    <!-- Belt / arms -->
    <rect x="4" y="13" width="24" height="3"/>
    <!-- Lower body -->
    <rect x="8" y="15" width="16" height="3"/>
    <!-- Legs -->
    <rect x="10" y="17" width="3" height="6"/>
    <rect x="19" y="17" width="3" height="6"/>
    <!-- Antenna -->
    <rect x="15" y="3" width="2" height="3"/>
  </g>
  <!-- Eyes — bright cyan for contrast at favicon size -->
  <g fill="#e6fbff">
    <rect x="12" y="9" width="2" height="2"/>
    <rect x="19" y="9" width="2" height="2"/>
  </g>
</svg>
