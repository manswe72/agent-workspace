<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 14" shape-rendering="crispEdges" aria-hidden="true">
  <!-- Head -->
  <rect x="4" y="1" width="12" height="6" fill="currentColor"/>
  <!-- Belt / arms (extends out) -->
  <rect x="1" y="6" width="18" height="2" fill="currentColor"/>
  <!-- Lower body -->
  <rect x="4" y="8" width="12" height="2" fill="currentColor"/>
  <!-- Two legs at the bottom -->
  <rect x="6" y="10" width="2" height="3" fill="currentColor"/>
  <rect x="12" y="10" width="2" height="3" fill="currentColor"/>
  <!-- Two thin eyes -->
  <rect x="7"  y="3" width="1" height="2" fill="#1a1a1a"/>
  <rect x="12" y="3" width="1" height="2" fill="#1a1a1a"/>
</svg>
